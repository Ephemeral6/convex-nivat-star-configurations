name = "nivat"
version = "0.1.0"
defaultTargets = ["Nivat"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

[[lean_lib]]
name = "Nivat"
# Without this, `lake build` compiles only what the `Nivat.lean` root transitively imports,
# which reaches exactly one file under `Nivat/External/Colle/` (`Interfaces`).  The other 38
# Colle modules were then never type-checked by the gate, so work in them could look green
# without ever having been compiled.  `Nivat.+` builds every module under `Nivat/`.
globs = ["Nivat", "Nivat.+"]
